openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: musicvizion
    description: MusicVizion companion responses
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /musicvizion/companion:
    post:
      operationId: createCompanionReply
      tags: [musicvizion]
      summary: Paid companion transport is disconnected under the owner's zero budget
      description: Always refuses under the current policy, including approved-looking requests. No provider request or retry is made.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovedCompanionInput"
      responses:
        "200":
          description: Companion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionReply"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Owner budget is zero, approval is invalid, or reliable pricing is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Grok service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /musicvizion/quote:
    post:
      operationId: quoteCompanionRequest
      tags: [musicvizion]
      summary: Review a request without invoking paid AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionInput"
      responses:
        "200":
          description: Local cost review with server-owned zero-dollar limits; no paid provider is contacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionQuote"
        "400":
          description: Invalid or oversized listening context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CompanionAnalysis:
      type: object
      properties:
        bpm:
          type: ["number", "null"]
        energy:
          type: ["number", "null"]
        brightness:
          type: ["number", "null"]
        pulse:
          type: ["number", "null"]
        source:
          type: string
          maxLength: 160
      required: [source]
    CompanionInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        artist:
          type: string
          maxLength: 160
        userMessage:
          type: string
          minLength: 1
          maxLength: 1200
        positionSeconds:
          type: number
          minimum: 0
        analysis:
          $ref: "#/components/schemas/CompanionAnalysis"
        preferences:
          type: array
          maxItems: 24
          items:
            type: string
            maxLength: 120
      required: [title, artist, userMessage, positionSeconds, analysis, preferences]
    ApprovedCompanionInput:
      type: object
      properties:
        request:
          $ref: "#/components/schemas/CompanionInput"
        approvalToken:
          type: string
          minLength: 32
          maxLength: 128
        approvedMaximumUsd:
          type: number
          minimum: 0
        approved:
          type: boolean
      required: [request, approvalToken, approvedMaximumUsd, approved]
    CompanionQuote:
      type: object
      properties:
        provider:
          type: string
        available:
          type: boolean
        estimatedMaximumUsd:
          type: ["number", "null"]
        approvalToken:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
        reason:
          type: string
        spendingStatus:
          type: string
          enum: [disabled_zero_budget]
          description: The owner authorized no spending. A saved API key does not override this policy.
        authorizedTotalBudgetUsd:
          type: number
          minimum: 0
          maximum: 0
        authorizedPerRequestMaximumUsd:
          type: number
          minimum: 0
          maximum: 0
        liveTestBudgetUsd:
          type: number
          minimum: 0
          maximum: 0
        requestContent:
          type: string
          enum: [text_features_only]
          description: This review contains metadata, text, and computed features, not audio.
        audioListeningAvailable:
          type: boolean
          enum: [false]
          description: Actual audio listening is not connected or authorized.
      required: [provider, available, estimatedMaximumUsd, approvalToken, expiresAt, reason, spendingStatus, authorizedTotalBudgetUsd, authorizedPerRequestMaximumUsd, liveTestBudgetUsd, requestContent, audioListeningAvailable]
    CompanionReply:
      type: object
      properties:
        reply:
          type: string
        preferenceSignal:
          type: ["string", "null"]
      required: [reply, preferenceSignal]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
